
  services:
    mysql:
      image: mysql:8.0.42
      container_name: internship-mysql
      environment:
        MYSQL_DATABASE: internship_db
        MYSQL_USER: appuser
        MYSQL_PASSWORD: apppass
        MYSQL_ROOT_PASSWORD: rootpass
      ports:
        - "3307:3306"
      volumes:
        - mysql_data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
        interval: 5s
        timeout: 5s
        retries: 20

    backend:
      build: .
      container_name: internship-backend
      ports:
        - "8080:8080"
      environment:
        DB_URL: jdbc:mysql://mysql:3306/internship_db
        DB_USERNAME: appuser
        DB_PASSWORD: apppass
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/internship_db
        SPRING_DATASOURCE_USERNAME: appuser
        SPRING_DATASOURCE_PASSWORD: apppass
      depends_on:
        mysql:
          condition: service_healthy

  volumes:
    mysql_data:
